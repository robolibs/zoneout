[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "zoneout"
version = "0.1.0"
description = "Rust hierarchical agricultural zone / workspace library for robotics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
features = ["python"]
module-name = "zoneout"
