[package]
name = "zoneout"
version = "0.1.0"
edition = "2024"
description = "Rust hierarchical agricultural zone / workspace library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]
# Keep the rerun example out of default `cargo build --examples` /
# `cargo test --all-targets` until the rerun dependency is restored.
rerun-viz = []

[dependencies]
concord = { git = "https://codeberg.org/robolibs/concord.git", tag = "0.1.0" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.2.0" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git", tag = "0.1.0" }
vectory = { git = "https://codeberg.org/robolibs/vectory.git", tag = "0.1.0" }
rastera = { git = "https://codeberg.org/robolibs/rastera.git", tag = "0.1.0" }
pyo3 = { version = "0.23", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"

[dev-dependencies]
# rerun temporarily disabled — requires newer rustc via zmij transitive
# rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"] }

[[example]]
name = "agricultural_visualization"
path = "examples/agricultural_visualization.rs"
required-features = ["rerun-viz"]
