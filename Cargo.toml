[package]
name = "zoneout"
version = "0.1.2"
edition = "2024"
description = "Rust hierarchical agricultural zone / workspace library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]
# Keep the rerun example out of default `cargo build --examples` /
# `cargo test --all-targets`; `--all-features` intentionally enables it.
rerun-viz = ["dep:rerun"]

[dependencies]
concord = { git = "https://codeberg.org/robolibs/concord.git", tag = "0.1.2" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.4.1" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git", tag = "0.1.2" }
vectory = { git = "https://codeberg.org/robolibs/vectory.git", tag = "0.1.2" }
rastera = { git = "https://codeberg.org/robolibs/rastera.git", tag = "0.1.2" }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"], optional = true }

[dev-dependencies]

[[example]]
name = "agricultural_visualization"
path = "examples/agricultural_visualization.rs"
required-features = ["rerun-viz"]
