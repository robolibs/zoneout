[package]
name = "zoneout"
version = "0.0.1"
edition = "2024"
description = "Rust hierarchical agricultural zone / workspace library for robotics"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]

[dependencies]
concord = { git = "https://codeberg.org/robolibs/concord.git" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git" }
graphix = { git = "https://codeberg.org/robolibs/graphix.git" }
vectory = { git = "https://codeberg.org/robolibs/vectory.git" }
rastera = { git = "https://codeberg.org/robolibs/rastera.git" }
pyo3 = { version = "0.23", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"

[dev-dependencies]
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"] }
